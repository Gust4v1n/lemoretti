<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeuApp - Contador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      min-width: 280px;
    }
    h1 { color: #333; margin-bottom: 8px; font-size: 1.8rem; }
    p { color: #666; margin-bottom: 30px; }
    #counter {
      font-size: 5rem;
      font-weight: bold;
      color: #667eea;
      margin: 20px 0;
      transition: transform 0.1s;
    }
    .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:active { transform: scale(0.95); }
    #btn-inc { background: #667eea; color: white; }
    #btn-dec { background: #f5f5f5; color: #333; }
    #btn-reset { background: #ff6b6b; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MeuApp</h1>
    <p>Contador Interativo</p>
    <div id="counter">0</div>
    <div class="btn-group">
      <button id="btn-dec">- Diminuir</button>
      <button id="btn-inc">+ Aumentar</button>
      <button id="btn-reset">Resetar</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
