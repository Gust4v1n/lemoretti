name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Java 17 ───────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Android SDK (usa o SDK já presente no runner) ─────────────────
      - name: Set ANDROID_HOME and install build-tools
        run: |
          # ubuntu-latest já tem Android SDK em /usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools"           >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0"       >> $GITHUB_PATH

          # Instala os pacotes necessários sem confirmação interativa
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ── 5. Instalar dependências Node ────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      # ── 6. Build Vite + Capacitor sync ───────────────────────────────────
      - name: Build web assets and sync Capacitor
        run: node build.js

      # ── 7. Permissão ao Gradle wrapper ───────────────────────────────────
      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      # ── 8. Compilar APK debug ────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # ── 9. Upload do APK como artefato ───────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
